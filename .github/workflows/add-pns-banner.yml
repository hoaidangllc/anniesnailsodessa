name: Add PNS promo banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pns-banner.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Phone Number Sale mini banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'class="pns-promo"' in s:
              raise SystemExit(0)

          css = '''
              /* Phone Number Sale cross-promo */
              .pns-promo{
                display:flex;align-items:center;justify-content:space-between;gap:18px;
                min-height:92px;padding:18px 22px;margin-bottom:18px;border-radius:24px;
                overflow:hidden;color:#fff;
                background:radial-gradient(circle at 82% 25%,rgba(224,178,82,.20),transparent 28%),linear-gradient(135deg,#07111f 0%,#0b1b31 58%,#111827 100%);
                border:1px solid rgba(210,165,73,.48);box-shadow:0 14px 32px rgba(7,17,31,.18);
                transition:transform .2s ease,box-shadow .2s ease;
              }
              .pns-promo:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(7,17,31,.24)}
              .pns-mark{flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d2a549;color:#f3c96b;font-size:17px;font-weight:900;letter-spacing:-.04em;box-shadow:inset 0 0 0 4px rgba(210,165,73,.10)}
              .pns-copy{min-width:0;flex:1}
              .pns-title{display:block;font-size:22px;line-height:1.05;font-weight:900;letter-spacing:.025em}
              .pns-tagline{display:block;margin-top:6px;color:rgba(255,255,255,.72);font-size:13px;letter-spacing:.04em}
              .pns-link{flex:0 0 auto;padding:11px 15px;border-radius:999px;background:linear-gradient(135deg,#f0c86c,#c99435);color:#17110a;font-size:13px;font-weight:900;white-space:nowrap}
              @media(max-width:640px){
                .pns-promo{min-height:84px;padding:14px 15px;gap:10px;border-radius:20px}
                .pns-mark{flex-basis:42px;width:42px;height:42px;font-size:14px}
                .pns-title{font-size:16px}.pns-tagline{font-size:10.5px}.pns-link{padding:8px 9px;font-size:10px}
              }
              @media(max-width:420px){
                .pns-mark{display:none}.pns-title{font-size:15px}.pns-tagline{font-size:10px}.pns-link{padding:8px;font-size:9.5px}
              }
          '''
          s = s.replace('    .footer{', css + '\n    .footer{', 1)

          banner = '''
              <a class="pns-promo" href="https://phonenumbersale.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Phone Number Sale">
                <span class="pns-mark" aria-hidden="true">PNS</span>
                <span class="pns-copy">
                  <span class="pns-title">PHONE NUMBER SALE</span>
                  <span class="pns-tagline">Premium • Memorable • Custom</span>
                </span>
                <span class="pns-link">PhoneNumberSale.com →</span>
              </a>

          '''
          marker = '    <div class="card">\n      <h2 class="section-title">Location</h2>'
          if marker not in s:
              raise SystemExit('Location marker not found')
          s = s.replace(marker, banner + marker, 1)
          p.write_text(s)
          PY
      - name: Commit homepage update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Phone Number Sale mini banner"
          git push
